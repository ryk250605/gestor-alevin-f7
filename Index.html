<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071521"><title>Gestor Alevín F7</title><style>
:root{--bg:#071521;--panel:#102638;--panel2:#152f43;--line:#294254;--text:#f3f8fa;--muted:#a1b4c2;--green:#30d57c;--blue:#58b8ff;--red:#ff6d78;--yellow:#ffce5b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0c2232,#06131e 65%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{background:#081b29;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px;max-width:100%;width:100%}textarea{min-height:82px}label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.app{max-width:1280px;margin:auto;min-height:100dvh;padding:20px 22px 105px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.crest{background:linear-gradient(145deg,#0c8d53,#18415a);border:2px solid #65e9a4;border-radius:15px;padding:10px;font-size:25px}.muted{color:var(--muted)}.tiny{font-size:12px}.h1{font-size:25px;font-weight:750}.h2{font-size:19px;font-weight:720;margin:0 0 14px}.card{background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:17px;padding:17px;min-width:0}.hero{background:linear-gradient(115deg,#164265d9,#0d2439dd),radial-gradient(circle at 85% 15%,#2e8766,transparent 50%);min-height:200px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.btn{background:#18384c;border:1px solid #315269;color:var(--text);padding:10px 14px;border-radius:11px;font-weight:650}.btn.primary{background:var(--green);color:#06251a;border-color:var(--green)}.btn.danger{background:#642d3c;border-color:#9a4251}.btn.small{padding:7px 10px;font-size:12px}.btn.active{border-color:var(--green);color:var(--green)}.pill{background:#193c4b;color:#bfe5d6;border-radius:20px;padding:5px 10px;font-size:12px}.kpi{font-size:31px;font-weight:800;margin:7px 0}.section{margin-top:18px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#071725f2;backdrop-filter:blur(14px);border-top:1px solid #284455;z-index:20;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom))}.nav{display:flex;max-width:900px;margin:auto;justify-content:space-around;gap:6px}.nav button{border:0;background:none;color:#9ab0bf;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 8px;font-size:11px;min-width:64px}.nav button b{font-size:22px}.nav button.active{color:var(--green)}.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 16px}.tabs button{white-space:nowrap}.list{display:grid;gap:8px}.item{border:1px solid var(--line);background:#0d2434;border-radius:12px;padding:12px}.player{display:flex;align-items:center;gap:10px}.avatar{width:55px;height:55px;border-radius:13px;background:#20485b;object-fit:cover;display:grid;place-items:center;font-size:24px;flex-shrink:0}.field{display:grid;gap:5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.modalbg{position:fixed;inset:0;background:#020910d9;z-index:40;display:flex;align-items:center;justify-content:center;padding:12px}.modal{background:#10283a;border:1px solid #3c5b6e;border-radius:20px;padding:20px;max-width:750px;width:100%;max-height:92dvh;overflow:auto}.modal h2{margin-top:0}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #39556a;border-radius:14px}.pitch{position:relative;min-height:420px;background:repeating-linear-gradient(0deg,#175c3e 0 55px,#1b6947 55px 110px);border:3px solid #92d7aa;border-radius:9px;overflow:hidden}.pitch:before{content:"";position:absolute;inset:15px;border:2px solid #b3edc799;pointer-events:none}.pitch:after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;transform:translate(-50%,-50%);border:2px solid #b3edc799;border-radius:50%;pointer-events:none}.slot{position:absolute;transform:translate(-50%,-50%);width:95px;text-align:center;z-index:1}.slot select{padding:6px;font-size:12px;background:#072d28e8;border:1px solid #79d8a6;width:100%}.slot .number{display:inline-block;border-radius:50%;background:#07243b;border:2px solid white;padding:7px;font-weight:800;margin-bottom:4px}.scroll{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:480px}.table th,.table td{padding:10px;text-align:left;border-bottom:1px solid #2b4658;font-size:13px}.table th{color:var(--muted)}.notice{padding:12px;border:1px solid #796a39;background:#3a321e;border-radius:11px;color:#f9df8d;font-size:13px}.bar{height:9px;border-radius:8px;background:#294357;overflow:hidden}.bar>span{display:block;height:100%;background:var(--green)}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:88px;border:1px solid #2b4658;border-radius:9px;padding:7px;background:#102638;overflow:hidden}.day.today{border-color:var(--green)}.event{font-size:10px;background:#1d7351;border-radius:5px;padding:3px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event.match{background:#77503a}.mini{font-size:11px}.tag{border-radius:6px;padding:3px 6px;background:#24465c;font-size:11px}.success{color:var(--green)}.warning{color:var(--yellow)}.dangertext{color:var(--red)}@media(max-width:740px){.app{padding:14px 12px 105px}.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.h1{font-size:21px}.card{padding:13px}.pitch{min-height:390px}.slot{width:75px}.slot select{font-size:10px}.day{min-height:67px;padding:3px}.event{font-size:9px}.top{align-items:flex-start}}@media(min-width:900px){.hero{min-height:245px}}
</style></head><body><div id="root"></div><script>
'use strict';const KEY='gestor_alevin_f7_v2';const initial=()=>({settings:{team:'Mi equipo',season:'2026/27',color:'#30d57c',half:30,halfCount:2},players:[],trainings:[],matches:[],rivals:[],results:[],evaluations:[],notes:[],events:[],activeMatch:null});let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}for(const [k,v] of Object.entries(initial()))if(db[k]===undefined)db[k]=v;let page='home',sub='home',selectedPlayer=null,selectedTraining=null,selectedMatch=null,calendarDate=new Date(),editing=null,clockTimer=null,clockRunning=false,clockStart=0,clockBase=0;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Math.random().toString(36).slice(2,11),dateNow=()=>new Date().toISOString().slice(0,10),fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):'Sin fecha',n=x=>Number(x)||0;function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('No se pudieron guardar los datos. Es posible que el almacenamiento esté lleno. Exporta una copia y reduce el tamaño de las imágenes.');return false}}function go(p,s){page=p;sub=s||p;selectedPlayer=null;selectedTraining=null;selectedMatch=null;render()}function btn(t,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}function card(body,extra=''){return `<div class="card ${extra}">${body}</div>`}function empty(t){return `<div class="empty">${t}</div>`}function label(t,value,type='text',name=t){return `<div class="field"><label>${esc(t)}</label><input name="${esc(name)}" type="${type}" value="${esc(value??'')}"></div>`}function sel(name,options,value){return `<select name="${esc(name)}">${options.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select>`}function formModal(title,html,onSubmit){$('overlay')?.remove();const d=document.createElement('div');d.className='modalbg';d.id='overlay';d.innerHTML=`<div class="modal"><div class="row between"><h2>${esc(title)}</h2><button class="btn small" onclick="closeModal()">✕</button></div><form id="editForm">${html}<div class="row wrap section">${btn('Guardar','', 'primary').replace('onclick=""','type="submit"')}${btn('Cancelar','closeModal()')}</div></form></div>`;document.body.append(d);$('editForm').onsubmit=e=>{e.preventDefault();let values=Object.fromEntries(new FormData(e.target).entries());onSubmit(values)}}function closeModal(){$('overlay')?.remove()}function showNotice(text){alert(text)}function render(){let navs=[['home','⌂','Inicio'],['players','♙','Plantilla'],['training','⚑','Entrenos'],['matches','⚽','Partidos'],['more','☰','Más']];$('root').innerHTML=`<main class="app"><header class="top"><div class="brand"><div class="crest">⚽</div><div><div class="muted tiny">TEMPORADA ${esc(db.settings.season)}</div><div class="h1">${esc(db.settings.team)}</div><div class="muted tiny">Gestor Alevín F7</div></div></div><div class="row">${btn('⚙','go(\'more\',\'settings\')','small')}</div></header><div id="content">${view()}</div></main><div class="bottom"><div class="nav">${navs.map(([k,ic,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><b>${ic}</b>${t}</button>`).join('')}</div></div>`;if(page==='matches'&&sub==='live')refreshClock()}function view(){if(page==='home')return home();if(page==='players')return players();if(page==='training')return training();if(page==='matches')return matches();return more()}function nextOf(arr){return arr.filter(x=>x.date>=dateNow()).sort((a,b)=>a.date.localeCompare(b.date))[0]}function home(){let m=nextOf(db.matches),t=nextOf(db.trainings),all=db.matches.filter(x=>x.status==='finished'),scored=all.reduce((s,x)=>s+n(x.our),0);return `<div class="grid g2">${card(`<div class="muted tiny">PRÓXIMO PARTIDO</div><h2>${m?esc(m.opponent):'Sin partido programado'}</h2><p>${m?fmt(m.date)+' · '+esc(m.time||'Hora pendiente'):'Añade tu primer encuentro'}</p><div class="muted">${m?esc(m.place||'Campo pendiente')+' · '+esc(m.type||'Liga'):'Gestiona convocatorias y alineaciones'}</div><div class="section">${btn('Ver partidos →',"go('matches')",'primary')}</div>`,'hero')}${card(`<div class="muted tiny">PRÓXIMO ENTRENAMIENTO</div><h2>${t?esc(t.title):'Sin sesión programada'}</h2><p>${t?fmt(t.date)+' · '+esc(t.time||'Hora pendiente'):'Crea tu planificación semanal'}</p><div class="muted">${t?esc(t.place||'Campo pendiente'):'Sesiones de 90 minutos'}</div><div class="section">${btn('Ver entrenamientos →',"go('training')",'primary')}</div>`,'hero')}</div><div class="grid g4 section">${card(`<div class="muted">Plantilla</div><div class="kpi">${db.players.length}</div><span class="tiny">Jugadores</span>`)}${card(`<div class="muted">Partidos</div><div class="kpi">${all.length}</div><span class="tiny">Finalizados</span>`)}${card(`<div class="muted">Goles</div><div class="kpi">${scored}</div><span class="tiny">A favor</span>`)}${card(`<div class="muted">Entrenos</div><div class="kpi">${db.trainings.length}</div><span class="tiny">Planificados</span>`)}</div><div class="grid g2 section">${card(`<h3>Últimos resultados</h3>${all.length?all.slice(-4).reverse().map(x=>`<div class="item row between"><span>${esc(x.opponent)}</span><strong>${n(x.our)} – ${n(x.their)}</strong></div>`).join(''):empty('Todavía no hay resultados')}`)}${card(`<h3>Avisos</h3><div class="list"><div class="item">${db.players.length?'Revisa la asistencia y evaluaciones de los jugadores.':'Añade los jugadores para comenzar.'}</div><div class="item">${db.matches.some(x=>x.status==='live')?'Hay un partido en curso.':'No hay partidos en directo.'}</div><div class="item">Exporta periódicamente una copia de seguridad desde Configuración.</div></div>`)}</div>`}
function players(){if(selectedPlayer){let p=db.players.find(x=>x.id===selectedPlayer);if(!p){selectedPlayer=null;return players()}let ev=db.evaluations.filter(x=>x.playerId===p.id).sort((a,b)=>b.date.localeCompare(a.date));let mins=db.matches.reduce((s,m)=>s+(m.minutes?.[p.id]||0),0);let goals=db.matches.reduce((s,m)=>s+(m.events||[]).filter(e=>e.type==='Gol'&&e.playerId===p.id).length,0);return `${btn('← Plantilla','selectedPlayer=null;render()')}<div class="section">${card(`<div class="row wrap"><div class="avatar">${p.photo?`<img class="avatar" src="${p.photo}" alt="">`:'⚽'}</div><div><div class="h1">${esc(p.number||'–')} · ${esc(p.name)}</div><div class="muted">${esc(p.position||'Sin posición')} · ${esc(p.secondary||'')}</div></div></div><div class="section grid g3">${card(`Partidos<div class="kpi">${db.matches.filter(m=>(m.minutes?.[p.id]||0)>0).length}</div>`)}${card(`Minutos<div class="kpi">${mins}</div>`)}${card(`Goles<div class="kpi">${goals}</div>`)}</div><div class="section">${btn('Editar ficha',`editPlayer('${p.id}')`)} ${btn('Nueva evaluación',`editEvaluation('${p.id}')`,'primary')}</div>`)}</div><div class="grid g2 section">${card(`<h3>Datos personales</h3><p>Nacimiento: ${fmt(p.birth)}</p><p>Contacto familiar: ${esc(p.guardian||'No registrado')}</p><p>Teléfono: ${esc(p.phone||'No registrado')}</p><p>Notas privadas: ${esc(p.notes||'Sin notas')}</p>`)}${card(`<h3>Evaluaciones</h3>${ev.length?ev.map(x=>`<div class="item"><b>${fmt(x.date)}</b><p>Técnica: ${esc(x.technical)} · Táctica: ${esc(x.tactical)}</p><p>Físico: ${esc(x.physical)} · Actitud: ${esc(x.attitude)}</p><p>${esc(x.note||'')}</p></div>`).join(''):empty('Sin evaluaciones todavía')}`)}</div>`}return `<div class="row between wrap"><h2 class="h2">Plantilla · ${db.players.length} jugadores</h2>${btn('＋ Añadir jugador','editPlayer()','primary')}</div>${db.players.length?`<div class="grid g3">${db.players.slice().sort((a,b)=>n(a.number)-n(b.number)).map(p=>`<div class="card"><div class="player"><div class="avatar">${p.photo?`<img class="avatar" src="${p.photo}" alt="">`:'⚽'}</div><div><strong>${esc(p.number||'–')} · ${esc(p.name)}</strong><div class="muted tiny">${esc(p.position||'Sin posición')}</div></div></div><div class="row section">${btn('Ver ficha',`selectedPlayer='${p.id}';render()`,'small primary')}${btn('Editar',`editPlayer('${p.id}')`,'small')}</div></div>`).join('')}</div>`:empty('Todavía no hay jugadores. Pulsa «Añadir jugador» para crear la plantilla.')}`}
function editPlayer(pid){let p=db.players.find(x=>x.id===pid)||{};formModal(pid?'Editar jugador':'Nuevo jugador',`<div class="formgrid">${label('Nombre y apellidos',p.name,'text','name')}${label('Dorsal',p.number,'number','number')}${label('Fecha de nacimiento',p.birth,'date','birth')}<div class="field"><label>Posición principal</label>${sel('position',['Portero','Defensa','Lateral','Centrocampista','Extremo','Delantero'],p.position)}</div><div class="field"><label>Posición secundaria</label>${sel('secondary',['','Portero','Defensa','Lateral','Centrocampista','Extremo','Delantero'],p.secondary)}</div>${label('Nombre del tutor/a',p.guardian,'text','guardian')}${label('Teléfono familiar',p.phone,'tel','phone')}</div><div class="field section"><label>Notas privadas</label><textarea name="notes">${esc(p.notes||'')}</textarea></div><div class="field section"><label>Fotografía (opcional, comprimida para guardado local)</label><input id="photoFile" type="file" accept="image/*"></div>${pid?`<div class="section">${btn('Eliminar jugador',`deleteRecord('players','${pid}')`,'danger')}</div>`:''}`,async v=>{if(!v.name.trim())return alert('Introduce el nombre.');let photo=p.photo||'';let f=$('photoFile').files[0];if(f)photo=await imageData(f);let obj={...p,...v,photo,id:pid||id()};if(pid)db.players=db.players.map(x=>x.id===pid?obj:x);else db.players.push(obj);if(save()){closeModal();render()}})}function imageData(f){return new Promise((resolve,reject)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,420/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.7))};im.onerror=reject;im.src=u})}function editEvaluation(pid){formModal('Nueva evaluación',`<div class="formgrid">${label('Fecha',dateNow(),'date','date')}${['technical','tactical','physical','attitude','goalkeeper'].map((k,i)=>`<div class="field"><label>${['Técnica','Táctica','Físico','Actitud','Portero'][i]}</label>${sel(k,['Sin evaluar','Bajo','Medio','Alto'],'Medio')}</div>`).join('')}</div><div class="field section"><label>Objetivos y observaciones</label><textarea name="note"></textarea></div>`,v=>{db.evaluations.push({...v,id:id(),playerId:pid});save();closeModal();render()})}
function training(){if(selectedTraining){let t=db.trainings.find(x=>x.id===selectedTraining);if(!t){selectedTraining=null;return training()}return `${btn('← Entrenamientos','selectedTraining=null;render()')}<div class="section">${card(`<div class="row between wrap"><div><div class="muted">${fmt(t.date)} · ${esc(t.time||'')}</div><h2>${esc(t.title)}</h2><p>${esc(t.place||'')} · ${n(t.duration)||90} minutos</p><p>Objetivo: ${esc(t.goal||'No especificado')}</p></div><div>${btn('Editar sesión',`editTraining('${t.id}')`)} ${btn('＋ Ejercicio',`editExercise('${t.id}')`,'primary')}</div></div>`)}</div><div class="grid g2 section">${card(`<h3>Ejercicios</h3>${(t.exercises||[]).length?t.exercises.map((x,i)=>`<div class="item"><div class="row between"><b>${i+1}. ${esc(x.title)}</b>${btn('Editar',`editExercise('${t.id}','${x.id}')`,'small')}</div><p>${n(x.duration)} min · ${esc(x.goal||'')}</p><p class="muted">${esc(x.description||'')}</p>${x.image?`<img src="${x.image}" style="width:100%;max-height:220px;object-fit:contain;border-radius:10px" alt="Imagen del ejercicio">`:''}${x.video?`<video controls preload="metadata" src="${x.video}" style="width:100%;max-height:250px"></video>`:''}</div>`).join(''):empty('Añade tus ejercicios e imágenes o vídeos propios.')}`)}${card(`<h3>Asistencia</h3>${db.players.length?db.players.map(p=>`<div class="item row between"><span>${esc(p.name)}</span><select style="width:155px" onchange="setAttendance('${t.id}','${p.id}',this.value)">${['Sin marcar','Presente','Ausente','Tarde','Justificado','Lesionado'].map(s=>`<option ${(t.attendance?.[p.id]||'Sin marcar')===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):empty('Añade jugadores para registrar asistencia.')}<div class="section"><label>Valoración de la sesión</label><textarea id="trainingReview" onchange="updateTrainingReview('${t.id}',this.value)">${esc(t.review||'')}</textarea></div>`)}</div>`}return `<div class="row between wrap"><h2>Entrenamientos</h2>${btn('＋ Nueva sesión','editTraining()','primary')}</div>${db.trainings.length?`<div class="list">${db.trainings.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="item row between wrap"><div><strong>${esc(t.title)}</strong><div class="muted tiny">${fmt(t.date)} · ${esc(t.time||'')} · ${(t.exercises||[]).length} ejercicios</div></div>${btn('Abrir sesión',`selectedTraining='${t.id}';render()`,'primary small')}</div>`).join('')}</div>`:empty('No hay sesiones. Crea tu primer entrenamiento de 90 minutos.')}`}
function editTraining(tid){let t=db.trainings.find(x=>x.id===tid)||{};formModal(tid?'Editar sesión':'Nueva sesión',`<div class="formgrid">${label('Título',t.title||'Entrenamiento','text','title')}${label('Fecha',t.date||dateNow(),'date','date')}${label('Hora',t.time||'18:00','time','time')}${label('Duración (minutos)',t.duration||90,'number','duration')}${label('Campo',t.place,'text','place')}${label('Objetivo',t.goal,'text','goal')}</div>${tid?`<div class="section">${btn('Eliminar sesión',`deleteRecord('trainings','${tid}')`,'danger')}</div>`:''}`,v=>{if(!v.title)return alert('Falta título');let obj={...t,...v,id:tid||id(),exercises:t.exercises||[],attendance:t.attendance||{}};if(tid)db.trainings=db.trainings.map(x=>x.id===tid?obj:x);else db.trainings.push(obj);save();closeModal();render()})}function editExercise(tid,eid){let t=db.trainings.find(x=>x.id===tid),e=(t.exercises||[]).find(x=>x.id===eid)||{};formModal(eid?'Editar ejercicio':'Añadir ejercicio',`${label('Nombre',e.title,'text','title')}<div class="formgrid">${label('Duración (min)',e.duration||15,'number','duration')}${label('Objetivo',e.goal,'text','goal')}${label('Jugadores y organización',e.organization,'text','organization')}${label('Material',e.material,'text','material')}${label('Dimensiones',e.space,'text','space')}</div><div class="field section"><label>Descripción, reglas, variantes y correcciones</label><textarea name="description">${esc(e.description||'')}</textarea></div><div class="field section"><label>Imagen del ejercicio</label><input id="exerciseImage" type="file" accept="image/*"></div><div class="field section"><label>Vídeo (se guardará localmente solo si el navegador dispone de espacio)</label><input id="exerciseVideo" type="file" accept="video/*"></div>${eid?`<div class="section">${btn('Eliminar ejercicio',`deleteExercise('${tid}','${eid}')`,'danger')}</div>`:''}`,async v=>{if(!v.title)return alert('Falta el nombre');let image=e.image||'',video=e.video||'';if($('exerciseImage').files[ const formations={'1-2-3-1':[[50,87],[27,67],[73,67],[20,44],[50,44],[80,44],[50,17]],'1-3-2-1':[[50,87],[20,68],[50,68],[80,68],[32,40],[68,40],[50,17]],'1-3-1-2':[[50,87],[20,68],[50,68],[80,68],[50,45],[30,18],[70,18]],'1-2-2-2':[[50,87],[30,67],[70,67],[30,44],[70,44],[30,18],[70,18]]};function matchDetail(m){let lineup=m.lineup||{},ids=Object.values(lineup).filter(Boolean),ev=m.events||[],elapsed=clockRunning&&selectedMatch===m.id?clockBase+Math.floor((Date.now()-clockStart)/1000):n(m.elapsed);let secs=String(elapsed%60).padStart(2,'0'),mins=Math.floor(elapsed/60);return `${btn('← Partidos','selectedMatch=null;sub=\'matches\';render()')}<div class="section">${card(`<div class="row between wrap"><div><div class="muted tiny">${esc(m.type)} · ${fmt(m.date)}</div><h2>${esc(db.settings.team)} <span class="success">${n(m.our)} – ${n(m.their)}</span> ${esc(m.opponent)}</h2><div class="muted">${m.status==='finished'?'Finalizado':m.status==='live'?'En directo':'Programado'} · Parte ${m.period||1}/${m.halfCount||2}</div></div><div class="row wrap">${btn('Editar',`editMatch('${m.id}')`)}${m.status!=='finished'?btn(m.status==='live'?'Finalizar':'Iniciar partido',m.status==='live'?`finishMatch('${m.id}')`:`startMatch('${m.id}')`,'primary'):''}</div></div><div class="row wrap section"><span class="h1" id="clock">${mins}:${secs}</span>${m.status==='live'?`${btn(clockRunning?'Pausar':'Reanudar',`toggleClock('${m.id}')`)} ${btn('Cambiar parte',`nextPeriod('${m.id}')`)} ${btn('＋ Gol',`addMatchEvent('${m.id}','Gol')`,'primary')} ${btn('⇄ Cambio',`substitute('${m.id}')`)} ${btn('Tarjeta',`addMatchEvent('${m.id}','Tarjeta')`)}`:''}</div>`)}</div><div class="grid g2 section">${card(`<div class="row between wrap"><h3>Alineación</h3><div class="row"><select id="formation" style="width:125px" onchange="setFormation('${m.id}',this.value)">${Object.keys(formations).map(f=>`<option ${f===(m.formation||'1-2-3-1')?'selected':''}>${f}</option>`).join('')}</select></div></div><div class="pitc function setFormation(mid,f){let m=db.matches.find(x=>x.id===mid);m.formation=f;save();render()}function setLineup(mid,i,pid){let m=db.matches.find(x=>x.id===mid);m.lineup=m.lineup||{};if(pid&&Object.entries(m.lineup).some(([j,v])=>j!==String(i)&&v===pid)){alert('El jugador ya está en el campo');render();return}if(m.status==='live'){alert('Durante el partido usa «Cambio» para registrar los minutos correctamente.');render();return}m.lineup[i]=pid;save();render()}function startMatch(mid){let m=db.matches.find(x=>x.id===mid);if(!Object.values(m.lineup||{}).some(Boolean))return alert('Selecciona primero una alineación.');m.status='live';m.intervals=m.intervals||{};m.elapsed=n(m.elapsed);clockBase=m.elapsed;clockStart=Date.now();clockRunning=true;Object.values(m.lineup).filter(Boolean).forEach(pid=>{if(m.intervals[pid]===undefined)m.intervals[pid]=m.elapsed});save();render()}function stopClock(mid){let m=db.matches.find(x=>x.id===mid);if(clockRunning){m.elapsed=clockBase+Math.floor((Date.now()-clockStart)/1000);clockRunning=false;clockBase=m.elapsed;save()}}function toggleClock(mid){if(clockRunning)stopClock(mid);else{let m=db.matches.find(x=>x.id===mid);clockBase=n(m.elapsed);clockStart=Date.now();clockRunning=true}render()}function refreshClock(){if(clockTimer)clearInterval(clockTimer);clockTimer=setInterval(()=>{if(page!=='matches'||!selectedMatch||!$('clock'))return;let m=db.matches.find(x=>x.id===selectedMatch);if(!m)return;let sec=clockRunning?clockBase+Math.floor((Date.now()-clockStart)/1000):n(m.elapsed);$('clock').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')},500)}function currentSec(m){return clockRunning?clockBase+Math.floor((Date.now()-clockStart)/1000):n(m.elapsed)}function closeInterval(m,pid,at){if(m.intervals?.[pid]!==undefined){m.minutes=m.minutes||{};m.minutes[pid]=n(m.minutes[pid])+Math.max(0,at-m.intervals[pid]);delete m.intervals[pid]}}function nextPeriod(mid){let m=db.matches.find(x=>x.id===mid),sec=currentSec(m);stopClock(mid); function rivals(){return `<div class="row between wrap">${btn('＋ Añadir rival','editRival()','primary')}</div><div class="list section">${db.rivals.length?db.rivals.map(r=>`<div class="item row between wrap"><div><b>${esc(r.name)}</b><p class="muted tiny">${esc(r.notes||'Sin observaciones')}</p></div>${btn('Editar',`editRival('${r.id}')`,'small')}</div>`).join(''):empty('No hay rivales registrados')}</div>`}function editRival(rid){let r=db.rivals.find(x=>x.id===rid)||{};formModal(rid?'Editar rival':'Nuevo rival',`${label('Nombre del equipo',r.name,'text','name')}<div class="field section"><label>Fortalezas, debilidades, sistema y observaciones</label><textarea name="notes">${esc(r.notes||'')}</textarea></div>${rid?btn('Eliminar',`deleteRecord('rivals','${rid}')`,'danger'):''}`,v=>{if(!v.name)return alert('Falta nombre');let o={...r,...v,id:rid||id()};db.rivals=rid?db.rivals.map(x=>x.id===rid?o:x):[...db.rivals,o];save();closeModal();render()})}
function reports(){return `${card(`<h3>Informes disponibles</h3><p class="muted">Puedes imprimir o guardar como PDF desde el diálogo de impresión del navegador, o exportar estadísticas como CSV.</p><div class="grid g2">${btn('Informe de plantilla',"printReport('players')")}${btn('Informe de partidos',"printReport('matches')")}${btn('Informe de entrenamientos',"printReport('trainings')")}${btn('Informe general',"printReport('general')")}${btn('Exportar estadísticas CSV','exportCSV()')}${btn('Exportar informe como imagen','exportReportImage()')}</div>`)}`}
function reportHTML(type){let head=`<h1>${esc(db.settings.team)} · ${esc(db.settings.season)}</h1><p>Gestor Alevín F7 · ${fmt(dateNow())}</p>`;let table=(rows)=>`<table border="1" cellspacing="0" cellpadding="8" style="border-collapse:collapse;width:100%">${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`;if(type==='players')return head+'<h2>Plantilla</h2>'+table([['Dorsal','Nombre','Posición'],...db.players.map(p=>[p.number,p.name,p.position])]);if(type==='matches')return head+'<h2>Partidos</h2>'+table([['Fecha','Rival','Resultado','Competición'],...db.matches.map(m=>[m.date,m.opponent,m.status==='finished'?m.our+'-'+m.their:'Pendiente',m.type])]);if(type==='trainings')return head+'<h2>Entrenamientos</h2>'+table([['Fecha','Sesión','Objetivo','Duración'],...db.trainings.map(t=>[t.date,t.title,t.goal,t.duration])]);return head+'<h2>Resumen</h2><p>Jugadores: '+db.players.length+'</p><p>Partidos: '+db.matches.length+'</p><p>Entrenamientos: '+db.trainings.length+'</p>'}function printReport(type){let w=window.open('','_blank');if(!w)return alert('Permite las ventanas emergentes para imprimir.');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Informe</title><style>body{font:15px Arial;padding:25px}td{font-size:13px}</style></head><body>'+reportHTML(type)+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),350)}function exportCSV(){let rows=[['Jugador','Partidos','Minutos','Goles','Asistencias','Tarjetas'],...db.players.map(p=>{let ev=db.matches.flatMap(m=>m.events||[]);return[p.name,db.matches.filter(m=>n(m.minutes?.[p.id])>0).length,Math.round(db.matches.reduce((s,m)=>s+n(m.minutes?.[p.id]),0)/60),ev.filter(x=>x.type==='Gol'&&x.playerId===p.id).length,ev.filter(x=>x.type==='Gol'&&x.assistId===p.id).length,ev.filter(x=>x.type==='Tarjeta'&&x.playerId===p.id).length]})];download(new Blob(['\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'estadisticas_f7.csv')}function exportReportImage(){let c=document.createElement('canvas');c.width=1200;c.height=700;let ctx=c.getContext('2d');ctx.fillStyle='#0a1e2d';ctx.fillRect(0,0,1200,700);ctx.fillStyle='#30d57c';ctx.font='bold 44px system-ui';ctx.fillText(db.settings.team,60,100);ctx.fillStyle='white';ctx.font='30px system-ui';ctx.fillText('Resumen de temporada '+db.settings.season,60,165);ctx.font='26px system-ui';['Jugadores: '+db.players.length,'Partidos: '+db.matches.length,'Entrenamientos: '+db.trainings.length,'Informe generado: '+fmt(dateNow())].forEach((x,i)=>ctx.fillText(x,60,260+i*75));c.toBlob(b=>download(b,'informe_f7.png'))}
function settings(){return `${card(`<h3>Equipo y temporada</h3><div class="formgrid">${label('Nombre del equipo',db.settings.team,'text','team')}${label('Temporada',db.settings.season,'text','season')}${label('Minutos por parte',db.settings.half,'number','half')}${label('Número de partes',db.settings.halfCount,'number','halfCount')}</div><div class="section">${btn('Guardar configuración','saveSettings()','primary')}</div>`)}<div class="section">${card(`<h3>Datos y copias de seguridad</h3><div class="row wrap">${btn('Descargar copia JSON','backup()','primary')}${btn('Restaurar copia','document.getElementById(\'restoreFile\').click()')}<input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreData(this.files[0])"></div><p class="muted tiny">Los datos se guardan únicamente en este navegador. Haz copias periódicas. Borrar datos de Safari puede eliminar la información local.</p><div class="notice">Pendiente: sincronización real con iCloud, autenticación biométrica y copias automáticas en la nube. No están activadas en esta versión.</div>`)}</div><div class="section">${card(`<h3>Privacidad y limitaciones</h3><p>Esta versión es de uso local. No publiques el archivo con información real de menores ni lo compartas sin protección. Las fotos y los contactos familiares requieren especial cuidado.</p><p class="muted">Los vídeos grandes no se guardan en este archivo: para ello necesitaremos un almacenamiento multimedia específico.</p>`)}</div>`}function saveSettings(){for(let k of ['team','season','half','halfCount']){let e=document.querySelector(`[name="${k}"]`);if(e)db.settings[k]=e.value}save();render()}function backup(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'gestor_f7_copia_'+dateNow()+'.json')}function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restoreData(f){if(!f)return;try{let v=JSON.parse(await f.text());if(!v.settings||!Array.isArray(v.players)||!Array.isArray(v.matches)||!Array.isArray(v.trainings))throw Error('Formato incorrecto');if(!confirm('Se sustituirán los datos actuales por la copia. ¿Continuar?'))return;db={...initial(),...v};save();render();alert('Copia restaurada')}catch(e){alert('No se pudo restaurar: '+e.message)}}function deleteRecord(key,recid){if(!confirm('¿Eliminar definitivamente este registro?'))return;db[key]=db[key].filter(x=>x.id!==recid);selectedPlayer=null;selectedTraining=null;selectedMatch=null;save();closeModal();render()}
window.addEventListener('pagehide',()=>{if(clockRunning&&selectedMatch){let m=db.matches.find(x=>x.id===selectedMatch);if(m){m.elapsed=currentSec(m);save()}}});render();
</script></body></html>
